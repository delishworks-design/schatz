name: Build Schatz APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: schatz-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: tgcalls ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    steps:
      - name: Checkout Schatz
        uses: actions/checkout@v4

      - name: Sparse-clone Telegram Android (voip engine)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/drklo/telegram.git telegram
          cd telegram
          git sparse-checkout set TMessagesProj/jni
          git submodule update --init --depth 1 \
            TMessagesProj/jni/third_party/libyuv \
            TMessagesProj/jni/third_party/absl \
            TMessagesProj/jni/third_party/boringssl \
            TMessagesProj/jni/third_party/libvpx \
            TMessagesProj/jni/third_party/dav1d \
            TMessagesProj/jni/third_party/ffmpeg \
            TMessagesProj/jni/third_party/wamr \
            TMessagesProj/jni/third_party/xiph/opus \
            TMessagesProj/jni/third_party/openh264 \
            TMessagesProj/jni/td
          du -sh TMessagesProj/jni

      - name: Build libtgcallsjni.so (${{ matrix.abi }})
        run: ./native/build.sh ${{ matrix.abi }} telegram/TMessagesProj/jni native-out

      - name: Check JNI exports
        run: |
          NDK="$(ls -d "${ANDROID_HOME:-/opt/android-sdk}/ndk"/*/ | sort -V | tail -1)"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "native-out/${{ matrix.abi }}/libtgcallsjni.so" | tee /tmp/nm.txt
          grep -q "Java_com_schatz_production_voip_NativeInstance_makeNativeInstance" /tmp/nm.txt
          grep -q "JNI_OnLoad" /tmp/nm.txt
          echo "JNI exports OK"

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: native-out/
          if-no-files-found: error
          retention-days: 3

  apk:
    name: APK
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Schatz
        uses: actions/checkout@v4

      - name: Download native libs into jniLibs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Verify jniLibs layout
        run: find app/src/main/jniLibs -type f -name '*.so' -exec ls -la {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 34
        run: |
          SM="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "using $SM"
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | "$SM" --licenses > /dev/null || true

      - name: Gate (tests + lint + debug + release)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SchatzProduction-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
