name: Build Schatz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Schatz project
        run: |
          rm -rf project
          mkdir project
          unzip -q "SchatzProduction_GitHubReady_v2_WithIcon.zip" -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 2 -type f | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Repair Gradle project settings
        working-directory: project
        run: |
          cat > settings.gradle.kts <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Schatz"
include(":app")
EOF

          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

          echo "===== ROOT ====="
          ls -la

          echo "===== APP ====="
          ls -la app 2>/dev/null || true

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build Schatz Debug APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schatz-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
