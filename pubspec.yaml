name: schatz
description: "Schatz - Premium AI Chat Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.17
  
  # Networking
  dio: ^5.4.0
  
  # SSH
  dartssh2: ^2.11.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Markdown
  flutter_markdown: ^0.6.18
  
  # Code Highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  
  # TTS
  flutter_tts: ^3.8.3
  
  # File Selection
  file_picker: ^8.0.0
  
  # Images
  image_picker: ^1.0.7
  
  # Image Processing
  flutter_image_compress: ^2.1.0
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Sharing
  share_plus: ^7.2.1
  
  # UUID
  uuid: ^4.2.1
  
  # Path
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # JSON
  json_annotation: ^4.8.1
  
  # Time
  intl: ^0.19.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Animation
  shimmer: ^3.0.0
  
  # URL
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  
  # Hive
  hive_generator: ^2.0.1
  
  # Testing
  mockito: ^5.4.4
  
  # Linting
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
  
