name: Build Schatz APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Schatz Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Schatz project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "SchatzProduction_GitHubReady_v2_WithIcon.zip" -d project

          echo "===== EXTRACTED FILES ====="
          find project -maxdepth 4 -type f | sort | head -300

      - name: Locate Android project
        run: |
          set -e

          if [ -f "project/gradlew" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          else
            ROOT=$(find project -maxdepth 3 -name gradlew -type f -print -quit | xargs -r dirname)

            if [ -z "$ROOT" ]; then
              echo "ERROR: gradlew was not found in the extracted project."
              echo "Searching for Gradle project files:"
              find project -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print
              exit 1
            fi

            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

          echo "Android project root: $PROJECT_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_ROOT }}
        run: chmod +x ./gradlew

      - name: Show Gradle version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "===== APK OUTPUT ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schatz-debug-apk
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
